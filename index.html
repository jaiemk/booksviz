<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Ratings Scatter Plots</title>
<style>
body{font-family:'Segoe UI',Roboto,sans-serif;background:#fafafa;color:#222;margin:0;padding:20px;}
svg{width:100%;height:350px;font:10px sans-serif;}
.grid line{stroke:#eee;}
</style>
</head>
<body>
<h1>Book Metrics vs Rating</h1>
<svg id="plot1"></svg>
<svg id="plot2"></svg>
<svg id="plot3"></svg>
<footer>Visualization by Codex. Data from <a href="https://github.com/zygmuntz/goodbooks-10k">GoodReads</a>.</footer>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
fetch('scatter_data.json').then(r=>r.json()).then(d=>{
  const plots=[
    {el:'#plot1',x:'pages',y:'rating',log:false,title:'Pages vs Rating'},
    {el:'#plot2',x:'blurb',y:'rating',log:false,title:'Blurb Length vs Rating'},
    {el:'#plot3',x:'reviews',y:'rating',log:true,title:'log10(Reviews) vs Rating'}
  ];
  plots.forEach(p=>draw(d,p));
  addEventListener('resize',()=>plots.forEach(p=>draw(d,p)));
});
  function draw(data,p){
    const svg=d3.select(p.el);
    svg.selectAll('*').remove();
    const g=svg.append('g');
    const m={l:50,r:30,t:20,b:40},w=p.el==='svg'?300:+svg.node().clientWidth,mw=w-m.l-m.r,h=350-m.t-m.b;
    g.attr('transform',`translate(${m.l},${m.t})`);
    const vals=data.map(d=>({x:+d[p.x],y:+d[p.y]}));
    if(p.log)vals.forEach(v=>v.x=Math.log10(v.x||1));
    const x=d3.scaleLinear().domain(d3.extent(vals,v=>v.x)).nice().range([0,mw]);
    const y=d3.scaleLinear().domain(d3.extent(vals,v=>v.y)).nice().range([h,0]);
    g.append('g').attr('transform',`translate(0,${h})`).call(d3.axisBottom(x).ticks(6)).call(g=>g.selectAll('.tick line').clone().attr('y1',-h).attr('stroke','#eee'));
    g.append('g').call(d3.axisLeft(y).ticks(6)).call(g=>g.selectAll('.tick line').clone().attr('x1',mw).attr('stroke','#eee'));
    g.selectAll('circle').data(vals).enter().append('circle').attr('cx',d=>x(d.x)).attr('cy',d=>y(d.y)).attr('r',6).attr('fill','steelblue').attr('opacity',0.2).append('title').text(d=>`${p.x}: ${d.x}\n${p.y}: ${d.y}`);
    const trend=loess(vals.map(v=>v.x),vals.map(v=>v.y));
    const lineGen=d3.line().x(d=>x(d[0])).y(d=>y(d[1]));
    g.append('path').datum(trend).attr('fill','none').attr('stroke','orange').attr('stroke-width',2).attr('d',lineGen);
    g.append('text').attr('x',mw/2).attr('y',-5).attr('text-anchor','middle').text(p.title);
  }
function loess(x,y,b=0.3){
  const n=x.length,r=Math.max(2,Math.ceil(b*n));
  return x.map((x0,i)=>{
    const idx=x.map((v,j)=>({d:Math.abs(v-x0),j})).sort((a,b)=>a.d-b.d).slice(0,r);
    const md=idx[r-1].d;let wx=0,wy=0,wxx=0,wxy=0,w=0;
    idx.forEach(o=>{const t=x[o.j]-x0,a=Math.pow(1-Math.pow(Math.abs(t)/md,3),3);w+=a;wx+=a*t;wy+=a*y[o.j];wxx+=a*t*t;wxy+=a*t*y[o.j];});
    const beta=(wxy-wx*wy/w)/(wxx-wx*wx/w),alpha=(wy-beta*wx)/w;return[x0,alpha];
  });
}
</script>
</body>
</html>
